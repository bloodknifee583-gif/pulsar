name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon -Pandroid.useAndroidX=true 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        shell: bash
        run: |
          { grep -E "^e: " build.log; grep -E "error: |What went wrong|Execution failed" -A2 build.log; } | head -30 | while IFS= read -r l; do echo "::error::${l}"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: player-apk
          path: build/outputs/apk/debug/*.apk
